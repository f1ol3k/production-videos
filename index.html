<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instrukcje</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">

const { useState, useRef, useEffect } = React;

const Play = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '▶️');
const Pause = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '⏸️');
const ChevronLeft = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '◀️');
const ChevronRight = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '▶️');
const Plus = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '➕');
const Trash2 = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '🗑️');
const Users = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '👥');
const FolderPlus = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '📁');
const Upload = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '📤');
const LogOut = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '🚪');
const Save = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '💾');
const X = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '❌');
const FileText = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '📄');
const Star = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '⭐');
const CheckCircle = ({ size }) => React.createElement('span', {style: {fontSize: size}}, '✅');

const ProductionVideoApp = () => {
  const [users, setUsers] = useState([
    { 
      username: 'operator1', 
      password: 'pass123', 
      role: 'operator',
      fullName: 'Jan Kowalski',
      skills: {
        montaz: 7,
        jakosc: 8,
        bezpieczenstwo: 9,
        szybkosc: 6,
        dokladnosc: 8
      }
    },
    { 
      username: 'operator2', 
      password: 'pass123', 
      role: 'operator',
      fullName: 'Anna Nowak',
      skills: {
        montaz: 9,
        jakosc: 9,
        bezpieczenstwo: 10,
        szybkosc: 8,
        dokladnosc: 9
      }
    },
    { 
      username: 'operator3', 
      password: 'pass123', 
      role: 'operator',
      fullName: 'Piotr Wiśniewski',
      skills: {
        montaz: 5,
        jakosc: 6,
        bezpieczenstwo: 7,
        szybkosc: 7,
        dokladnosc: 6
      }
    },
    { username: 'admin', password: 'admin123', role: 'admin', fullName: 'Administrator' }
  ]);
  
  const [documents, setDocuments] = useState([
    {
      id: 1,
      name: 'Szkolenie BHP 2024',
      description: 'Podstawowe szkolenie z bezpieczeństwa i higieny pracy',
      signatures: ['operator1', 'operator2']
    },
    {
      id: 2,
      name: 'Instrukcja obsługi maszyn',
      description: 'Szkolenie z obsługi maszyn produkcyjnych',
      signatures: ['operator2']
    }
  ]);
  
  const [currentUser, setCurrentUser] = useState(null);
  const [loginForm, setLoginForm] = useState({ username: '', password: '' });
  const [loginError, setLoginError] = useState('');
  
  const [productionLines, setProductionLines] = useState([
    {
      id: 1,
      name: 'Linia 1',
      instructions: [
        {
          id: 1,
          name: 'Proces Montażu A',
          steps: [
            { id: 1, videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', name: 'Krok 1' },
            { id: 2, videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', name: 'Krok 2' },
            { id: 3, videoUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', name: 'Krok 3' }
          ]
        }
      ]
    }
  ]);
  
  const [selectedLine, setSelectedLine] = useState(null);
  const [selectedInstruction, setSelectedInstruction] = useState(null);
  const [currentStep, setCurrentStep] = useState(0);
  const [playbackSpeed, setPlaybackSpeed] = useState(1);
  const [isPlaying, setIsPlaying] = useState(true);
  
  const [showAdminPanel, setShowAdminPanel] = useState(false);
  const [showUserCreation, setShowUserCreation] = useState(false);
  const [showLineCreation, setShowLineCreation] = useState(false);
  const [showInstructionCreation, setShowInstructionCreation] = useState(false);
  const [showOperatorManagement, setShowOperatorManagement] = useState(false);
  const [showDocumentManagement, setShowDocumentManagement] = useState(false);
  const [selectedOperator, setSelectedOperator] = useState(null);
  const [showDocumentCreation, setShowDocumentCreation] = useState(false);
  
  const [newUser, setNewUser] = useState({ username: '', password: '', fullName: '' });
  const [newLineName, setNewLineName] = useState('');
  const [newInstruction, setNewInstruction] = useState({ name: '', stepCount: 3, steps: [] });
  const [newDocument, setNewDocument] = useState({ name: '', description: '' });
  const [editingLine, setEditingLine] = useState(null);
  
  const videoRef = useRef(null);

  useEffect(() => {
    if (videoRef.current) {
      videoRef.current.playbackRate = playbackSpeed;
    }
  }, [playbackSpeed]);

  const handleLogin = (e) => {
    e.preventDefault();
    const user = users.find(u => u.username === loginForm.username && u.password === loginForm.password);
    if (user) {
      setCurrentUser(user);
      setLoginError('');
      setLoginForm({ username: '', password: '' });
    } else {
      setLoginError('Nieprawidłowe dane logowania');
    }
  };

  const handleLogout = () => {
    setCurrentUser(null);
    setSelectedLine(null);
    setSelectedInstruction(null);
    setShowAdminPanel(false);
    setShowOperatorManagement(false);
    setShowDocumentManagement(false);
  };

  const handleStepChange = (direction) => {
    if (!selectedInstruction) return;
    const newStep = currentStep + direction;
    if (newStep >= 0 && newStep < selectedInstruction.steps.length) {
      setCurrentStep(newStep);
      setIsPlaying(true);
    }
  };

  const createUser = () => {
    if (newUser.username && newUser.password && newUser.fullName) {
      setUsers([...users, { 
        ...newUser, 
        role: 'operator',
        skills: {
          montaz: 5,
          jakosc: 5,
          bezpieczenstwo: 5,
          szybkosc: 5,
          dokladnosc: 5
        }
      }]);
      setNewUser({ username: '', password: '', fullName: '' });
      setShowUserCreation(false);
    }
  };

  const updateOperatorSkills = (username, skill, value) => {
    setUsers(users.map(user => 
      user.username === username && user.role === 'operator'
        ? { ...user, skills: { ...user.skills, [skill]: value } }
        : user
    ));
  };

  const createLine = () => {
    if (newLineName) {
      const newLine = {
        id: Date.now(),
        name: newLineName,
        instructions: []
      };
      setProductionLines([...productionLines, newLine]);
      setNewLineName('');
      setShowLineCreation(false);
    }
  };

  const startInstructionCreation = (lineId) => {
    setEditingLine(lineId);
    setNewInstruction({ name: '', stepCount: 3, steps: Array(3).fill(null).map((_, i) => ({ id: i + 1, videoUrl: '', name: `Krok ${i + 1}` })) });
    setShowInstructionCreation(true);
  };

  const updateStepCount = (count) => {
    const clampedCount = Math.min(Math.max(count, 1), 25);
    const current = newInstruction.steps.length;
    if (clampedCount > current) {
      const newSteps = [...newInstruction.steps];
      for (let i = current; i < clampedCount; i++) {
        newSteps.push({ id: i + 1, videoUrl: '', name: `Krok ${i + 1}` });
      }
      setNewInstruction({ ...newInstruction, stepCount: clampedCount, steps: newSteps });
    } else if (clampedCount < current) {
      setNewInstruction({ ...newInstruction, stepCount: clampedCount, steps: newInstruction.steps.slice(0, clampedCount) });
    }
  };

  const handleVideoUpload = (stepId, event) => {
    const file = event.target.files[0];
    if (file) {
      const videoUrl = URL.createObjectURL(file);
      const updatedSteps = newInstruction.steps.map(step => 
        step.id === stepId ? { ...step, videoUrl } : step
      );
      setNewInstruction({ ...newInstruction, steps: updatedSteps });
    }
  };

  const deleteEmptySteps = () => {
    const filledSteps = newInstruction.steps.filter(step => step.videoUrl);
    setNewInstruction({ ...newInstruction, steps: filledSteps, stepCount: filledSteps.length });
  };

  const publishInstruction = () => {
    if (!newInstruction.name || newInstruction.steps.filter(s => s.videoUrl).length === 0) {
      alert('Proszę dodać nazwę instrukcji i przynajmniej jedno wideo');
      return;
    }
    
    const filledSteps = newInstruction.steps.filter(step => step.videoUrl);
    const instruction = {
      id: Date.now(),
      name: newInstruction.name,
      steps: filledSteps
    };
    
    setProductionLines(productionLines.map(line => 
      line.id === editingLine 
        ? { ...line, instructions: [...line.instructions, instruction] }
        : line
    ));
    
    setShowInstructionCreation(false);
    setNewInstruction({ name: '', stepCount: 3, steps: [] });
    setEditingLine(null);
  };

  const createDocument = () => {
    if (newDocument.name && newDocument.description) {
      const doc = {
        id: Date.now(),
        name: newDocument.name,
        description: newDocument.description,
        signatures: []
      };
      setDocuments([...documents, doc]);
      setNewDocument({ name: '', description: '' });
      setShowDocumentCreation(false);
    }
  };

  const signDocument = (docId) => {
    setDocuments(documents.map(doc => 
      doc.id === docId && !doc.signatures.includes(currentUser.username)
        ? { ...doc, signatures: [...doc.signatures, currentUser.username] }
        : doc
    ));
  };

  const skillCategories = {
    montaz: 'Montaż',
    jakosc: 'Kontrola jakości',
    bezpieczenstwo: 'Bezpieczeństwo',
    szybkosc: 'Szybkość pracy',
    dokladnosc: 'Dokładność'
  };

  if (!currentUser) {
    return (
      <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
        <div className="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
          <h1 className="text-3xl font-bold text-gray-800 mb-6 text-center">Instrukcje Wideo</h1>
          <div className="space-y-4">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">Nazwa użytkownika</label>
              <input
                type="text"
                value={loginForm.username}
                onChange={(e) => setLoginForm({ ...loginForm, username: e.target.value })}
                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-2">Hasło</label>
              <input
                type="password"
                value={loginForm.password}
                onChange={(e) => setLoginForm({ ...loginForm, password: e.target.value })}
                onKeyPress={(e) => e.key === 'Enter' && handleLogin(e)}
                className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
              />
            </div>
            {loginError && <p className="text-red-500 text-sm">{loginError}</p>}
            <button onClick={handleLogin} className="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
              Zaloguj
            </button>
          </div>
          <p className="text-xs text-gray-500 mt-4 text-center">Demo: operator1/pass123 lub admin/admin123</p>
        </div>
      </div>
    );
  }

  if (currentUser.role === 'operator' && !selectedLine && !selectedInstruction) {
    const unsignedDocs = documents.filter(doc => !doc.signatures.includes(currentUser.username));
    
    return (
      <div className="min-h-screen bg-gradient-to-br from-gray-50 to-blue-50 p-4">
        <div className="max-w-6xl mx-auto">
          <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
            <div className="flex justify-between items-center">
              <div>
                <h1 className="text-3xl font-bold text-gray-800">Instrukcje wideo produkcyjne</h1>
                <p className="text-gray-600">Witaj, {currentUser.fullName} ({currentUser.username})</p>
              </div>
              <button onClick={handleLogout} className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 flex items-center gap-2">
                <LogOut size={16} /> Wyloguj
              </button>
            </div>
          </div>

          {unsignedDocs.length > 0 && (
            <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6">
              <h2 className="text-lg font-semibold text-yellow-800 mb-3">📋 Dokumenty do podpisania ({unsignedDocs.length})</h2>
              <div className="space-y-2">
                {unsignedDocs.map(doc => (
                  <div key={doc.id} className="bg-white p-4 rounded-lg flex justify-between items-center">
                    <div>
                      <h3 className="font-semibold">{doc.name}</h3>
                      <p className="text-sm text-gray-600">{doc.description}</p>
                    </div>
                    <button 
                      onClick={() => signDocument(doc.id)}
                      className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2"
                    >
                      <CheckCircle size={16} /> Podpisz
                    </button>
                  </div>
                ))}
              </div>
            </div>
          )}

          <h2 className="text-2xl font-bold mb-4">Linie produkcyjne</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {productionLines.map(line => (
              <button
                key={line.id}
                onClick={() => setSelectedLine(line)}
                className="bg-white p-6 rounded-lg shadow-md hover:shadow-xl transition transform hover:scale-105"
              >
                <h3 className="text-xl font-bold text-gray-800 mb-2">{line.name}</h3>
                <p className="text-gray-600">{line.instructions.length} instrukcji</p>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  if (showOperatorManagement && selectedOperator) {
    const operator = users.find(u => u.username === selectedOperator);
    const signedDocs = documents.filter(doc => doc.signatures.includes(selectedOperator));
    
    return (
      <div className="min-h-screen bg-gray-50 p-4">
        <div className="max-w-4xl mx-auto">
          <div className="bg-white rounded-lg shadow-lg p-6">
            <button 
              onClick={() => setSelectedOperator(null)} 
              className="mb-4 px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300"
            >
              ← Powrót do listy
            </button>
            
            <div className="mb-6">
              <h1 className="text-3xl font-bold text-gray-800">{operator.fullName}</h1>
              <p className="text-gray-600">@{operator.username}</p>
            </div>

            <div className="mb-8">
              <h2 className="text-xl font-semibold mb-4">Umiejętności operatora</h2>
              <div className="space-y-4">
                {Object.keys(skillCategories).map(skill => (
                  <div key={skill}>
                    <div className="flex justify-between mb-2">
                      <span className="font-medium">{skillCategories[skill]}</span>
                      <span className="font-bold text-blue-600">{operator.skills[skill]}/10</span>
                    </div>
                    <input
                      type="range"
                      min="1"
                      max="10"
                      value={operator.skills[skill]}
                      onChange={(e) => updateOperatorSkills(selectedOperator, skill, parseInt(e.target.value))}
                      className="w-full"
                    />
                  </div>
                ))}
              </div>
            </div>

            <div>
              <h2 className="text-xl font-semibold mb-4">Podpisane dokumenty ({signedDocs.length})</h2>
              <div className="space-y-2">
                {signedDocs.length > 0 ? (
                  signedDocs.map(doc => (
                    <div key={doc.id} className="bg-green-50 p-3 rounded-lg flex items-center gap-2">
                      <CheckCircle size={16} />
                      <div>
                        <p className="font-medium">{doc.name}</p>
                        <p className="text-sm text-gray-600">{doc.description}</p>
                      </div>
                    </div>
                  ))
                ) : (
                  <p className="text-gray-500">Brak podpisanych dokumentów</p>
                )}
              </div>
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (showOperatorManagement) {
    const operators = users.filter(u => u.role === 'operator');
    
    return (
      <div className="min-h-screen bg-gray-50 p-4">
        <div className="max-w-6xl mx-auto">
          <div className="bg-white rounded-lg shadow-lg p-6">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-2xl font-bold text-gray-800">Zarządzanie operatorami</h1>
              <button 
                onClick={() => setShowOperatorManagement(false)} 
                className="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300"
              >
                Powrót do panelu
              </button>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {operators.map(operator => {
                const avgSkill = Math.round(Object.values(operator.skills).reduce((a, b) => a + b, 0) / 5);
                const signedCount = documents.filter(doc => doc.signatures.includes(operator.username)).length;
                
                return (
                  <button
                    key={operator.username}
                    onClick={() => setSelectedOperator(operator.username)}
                    className="bg-white border-2 border-gray-200 p-6 rounded-lg hover:border-blue-500 transition text-left"
                  >
                    <h3 className="text-xl font-bold text-gray-800 mb-2">{operator.fullName}</h3>
                    <p className="text-sm text-gray-600 mb-3">@{operator.username}</p>
                    <div className="flex items-center gap-2 mb-2">
                      <Star size={16} />
                      <span className="text-sm">Średnia ocena: {avgSkill}/10</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <CheckCircle size={16} />
                      <span className="text-sm">Podpisane dokumenty: {signedCount}</span>
                    </div>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (showDocumentManagement) {
    return (
      <div className="min-h-screen bg-gray-50 p-4">
        <div className="max-w-6xl mx-auto">
          <div className="bg-white rounded-lg shadow-lg p-6">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-2xl font-bold text-gray-800">Zarządzanie dokumentami</h1>
              <div className="flex gap-2">
                <button 
                  onClick={() => setShowDocumentCreation(true)} 
                  className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center gap-2"
                >
                  <Plus size={16} /> Nowy dokument
                </button>
                <button 
                  onClick={() => setShowDocumentManagement(false)} 
                  className="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300"
                >
                  Powrót do panelu
                </button>
              </div>
            </div>

            <div className="space-y-4">
              {documents.map(doc => (
                <div key={doc.id} className="border rounded-lg p-4">
                  <div className="flex justify-between items-start mb-3">
                    <div>
                      <h3 className="text-lg font-semibold">{doc.name}</h3>
                      <p className="text-sm text-gray-600">{doc.description}</p>
                    </div>
                    <span className="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-sm">
                      {doc.signatures.length} podpisów
                    </span>
                  </div>
                  
                  <div className="flex flex-wrap gap-2">
                    {doc.signatures.map(username => {
                      const user = users.find(u => u.username === username);
                      return (
                        <span key={username} className="bg-green-100 text-green-800 px-2 py-1 rounded text-sm">
                          ✓ {user?.fullName || username}
                        </span>
                      );
                    })}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {showDocumentCreation && (
          <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
            <div className="bg-white rounded-lg p-6 max-w-md w-full">
              <h2 className="text-xl font-bold mb-4">Nowy dokument</h2>
              <div className="space-y-3">
                <div>
                  <label className="block text-sm font-medium mb-2">Nazwa dokumentu</label>
                  <input
                    type="text"
                    value={newDocument.name}
                    onChange={(e) => setNewDocument({ ...newDocument, name: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg"
                    placeholder="np. Szkolenie BHP 2025"
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-2">Opis</label>
                  <textarea
                    value={newDocument.description}
                    onChange={(e) => setNewDocument({ ...newDocument, description: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg"
                    rows="3"
                    placeholder="Opisz zawartość dokumentu..."
                  />
                </div>
                <div className="flex gap-2">
                  <button 
                    onClick={createDocument} 
                    className="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700"
                  >
                    Utwórz
                  </button>
                  <button 
                    onClick={() => setShowDocumentCreation(false)} 
                    className="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400"
                  >
                    Anuluj
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  if (showAdminPanel) {
    return (
      <div className="min-h-screen bg-gray-50 p-4">
        <div className="max-w-6xl mx-auto">
          <div className="bg-white rounded-lg shadow-lg p-6 mb-4">
            <div className="flex justify-between items-center mb-6">
              <h1 className="text-2xl font-bold text-gray-800">Panel Administratora</h1>
              <div className="flex gap-2">
                <button onClick={() => setShowAdminPanel(false)} className="px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
                  Powrót do widoku
                </button>
                <button onClick={handleLogout} className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 flex items-center gap-2">
                  <LogOut size={16} /> Wyloguj
                </button>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <button onClick={() => setShowUserCreation(true)} className="p-6 bg-blue-50 rounded-lg hover:bg-blue-100 transition flex flex-col items-center gap-2">
                <Users size={32} />
                <span className="font-semibold">Utwórz użytkownika</span>
              </button>
              <button onClick={() => setShowLineCreation(true)} className="p-6 bg-green-50 rounded-lg hover:bg-green-100 transition flex flex-col items-center gap-2">
                <FolderPlus size={32} />
                <span className="font-semibold">Utwórz linię</span>
              </button>
              <button onClick={() => setShowOperatorManagement(true)} className="p-6 bg-purple-50 rounded-lg hover:bg-purple-100 transition flex flex-col items-center gap-2">
                <Star size={32} />
                <span className="font-semibold">Operatorzy</span>
              </button>
              <button onClick={() => setShowDocumentManagement(true)} className="p-6 bg-orange-50 rounded-lg hover:bg-orange-100 transition flex flex-col items-center gap-2">
                <FileText size={32} />
                <span className="font-semibold">Dokumenty</span>
              </button>
            </div>

            {showUserCreation && (
              <div className="bg-blue-50 p-4 rounded-lg mb-4">
                <h3 className="font-semibold mb-3">Utwórz nowego użytkownika</h3>
                <div className="space-y-3">
                  <input
                    type="text"
                    placeholder="Imię i nazwisko"
                    value={newUser.fullName}
                    onChange={(e) => setNewUser({ ...newUser, fullName: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg"
                  />
                  <input
                    type="text"
                    placeholder="Nazwa użytkownika"
                    value={newUser.username}
                    onChange={(e) => setNewUser({ ...newUser, username: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg"
                  />
                  <input
                    type="password"
                    placeholder="Hasło"
                    value={newUser.password}
                    onChange={(e) => setNewUser({ ...newUser, password: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg"
                  />
                  <div className="flex gap-2">
                    <button onClick={createUser} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                      Utwórz
                    </button>
                    <button onClick={() => setShowUserCreation(false)} className="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
                      Anuluj
                    </button>
                  </div>
                </div>
              </div>
            )}

            {showLineCreation && (
              <div className="bg-green-50 p-4 rounded-lg mb-4">
                <h3 className="font-semibold mb-3">Utwórz nową linię produkcyjną</h3>
                <div className="space-y-3">
                  <input
                    type="text"
                    placeholder="Nazwa linii"
                    value={newLineName}
                    onChange={(e) => setNewLineName(e.target.value)}
                    className="w-full px-3 py-2 border rounded-lg"
                  />
                  <div className="flex gap-2">
                    <button onClick={createLine} className="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                      Utwórz
                    </button>
                    <button onClick={() => setShowLineCreation(false)} className="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
                      Anuluj
                    </button>
                  </div>
                </div>
              </div>
            )}

            <div className="space-y-4">
              <h2 className="text-xl font-semibold">Linie produkcyjne</h2>
              {productionLines.map(line => (
                <div key={line.id} className="border rounded-lg p-4">
                  <div className="flex justify-between items-center mb-3">
                    <h3 className="text-lg font-semibold">{line.name}</h3>
                    <button 
                      onClick={() => startInstructionCreation(line.id)}
                      className="px-3 py-1 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 flex items-center gap-1 text-sm"
                    >
                      <Plus size={16} /> Dodaj instrukcję
                    </button>
                  </div>
                  <div className="space-y-2">
                    {line.instructions.map(inst => (
                      <div key={inst.id} className="bg-gray-50 p-3 rounded">
                        <p className="font-medium">{inst.name}</p>
                        <p className="text-sm text-gray-600">{inst.steps.length} kroków</p>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>

        {showInstructionCreation && (
          <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 overflow-y-auto">
            <div className="bg-white rounded-lg p-6 max-w-4xl w-full my-8">
              <div className="flex justify-between items-center mb-4">
                <h2 className="text-xl font-bold">Utwórz nową instrukcję</h2>
                <button onClick={() => setShowInstructionCreation(false)} className="text-gray-500 hover:text-gray-700">
                  <X size={24} />
                </button>
              </div>
              
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-medium mb-2">Nazwa instrukcji</label>
                  <input
                    type="text"
                    value={newInstruction.name}
                    onChange={(e) => setNewInstruction({ ...newInstruction, name: e.target.value })}
                    className="w-full px-3 py-2 border rounded-lg"
                    placeholder="np. Proces montażu B"
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium mb-2">Liczba kroków (Maks 25)</label>
                  <input
                    type="number"
                    min="1"
                    max="25"
                    value={newInstruction.stepCount}
                    onChange={(e) => updateStepCount(parseInt(e.target.value) || 1)}
                    className="w-full px-3 py-2 border rounded-lg"
                  />
                </div>

                <div className="space-y-3 max-h-96 overflow-y-auto pr-2">
                  <div className="flex justify-between items-center sticky top-0 bg-white py-2 z-10">
                    <h3 className="font-semibold">Kroki</h3>
                    <button onClick={deleteEmptySteps} className="text-sm text-red-600 hover:text-red-700 flex items-center gap-1">
                      <Trash2 size={14} /> Usuń puste kroki
                    </button>
                  </div>
                  
                  {newInstruction.steps.map((step, index) => (
                    <div key={step.id} className="border rounded-lg p-4 bg-gray-50">
                      <div className="flex justify-between items-center mb-2">
                        <h4 className="font-medium">Krok {index + 1}</h4>
                        {step.videoUrl && <span className="text-green-600 text-sm">✓ Wideo dodane</span>}
                      </div>
                      <label className="block">
                        <div className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 cursor-pointer text-center flex items-center justify-center gap-2">
                          <Upload size={16} />
                          {step.videoUrl ? 'Zmień wideo' : 'Prześlij wideo'}
                        </div>
                        <input
                          type="file"
                          accept="video/*"
                          onChange={(e) => handleVideoUpload(step.id, e)}
                          className="hidden"
                        />
                      </label>
                    </div>
                  ))}
                </div>

                <div className="flex gap-2 pt-4">
                  <button onClick={publishInstruction} className="flex-1 px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 flex items-center justify-center gap-2">
                    <Save size={16} /> Opublikuj instrukcję
                  </button>
                  <button onClick={() => setShowInstructionCreation(false)} className="px-4 py-2 bg-gray-300 rounded-lg hover:bg-gray-400">
                    Anuluj
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  if (selectedInstruction) {
    const currentStepData = selectedInstruction.steps[currentStep];
    
    return (
      <div className="min-h-screen bg-gray-900 flex flex-col">
        <div className="bg-gray-800 text-white p-4 flex justify-between items-center">
          <div>
            <h2 className="text-xl font-bold">{selectedInstruction.name}</h2>
            <p className="text-sm text-gray-400">Krok {currentStep + 1} z {selectedInstruction.steps.length}</p>
          </div>
          <button onClick={() => { setSelectedInstruction(null); setCurrentStep(0); }} className="px-4 py-2 bg-gray-700 rounded-lg hover:bg-gray-600">
            Powrót
          </button>
        </div>

        <div className="flex-1 flex items-center justify-center p-4">
          <video
            ref={videoRef}
            src={currentStepData.videoUrl}
            className="max-w-full max-h-full rounded-lg shadow-2xl"
            loop
            autoPlay={isPlaying}
            onEnded={() => setIsPlaying(true)}
          />
        </div>

        <div className="bg-gray-800 p-6 space-y-4">
          <div className="flex items-center justify-center gap-4">
            <button
              onClick={() => handleStepChange(-1)}
              disabled={currentStep === 0}
              className="p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700 disabled:bg-gray-600 disabled:cursor-not-allowed"
            >
              <ChevronLeft size={24} />
            </button>

            <button
              onClick={() => setIsPlaying(!isPlaying)}
              className="p-4 bg-green-600 text-white rounded-full hover:bg-green-700"
            >
              {isPlaying ? <Pause size={24} /> : <Play size={24} />}
            </button>

            {currentStep === selectedInstruction.steps.length - 1 ? (
              <button
                onClick={() => { setSelectedInstruction(null); setCurrentStep(0); }}
                className="px-6 py-4 bg-green-600 text-white rounded-full hover:bg-green-700 font-semibold"
              >
                Zakończ lekcję
              </button>
            ) : (
              <button
                onClick={() => handleStepChange(1)}
                className="p-4 bg-blue-600 text-white rounded-full hover:bg-blue-700"
              >
                <ChevronRight size={24} />
              </button>
            )}
          </div>

          <div className="flex items-center justify-center gap-4">
            <label className="text-white font-medium">Prędkość odtwarzania:</label>
            <select
              value={playbackSpeed}
              onChange={(e) => setPlaybackSpeed(parseFloat(e.target.value))}
              className="px-4 py-2 bg-gray-700 text-white rounded-lg border border-gray-600"
            >
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1">1x (Normalna)</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gradient-to-br from-gray-50 to-blue-50 p-4">
      <div className="max-w-6xl mx-auto">
        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
          <div className="flex justify-between items-center">
            <div>
              <h1 className="text-3xl font-bold text-gray-800">Instrukcje wideo produkcyjne</h1>
              <p className="text-gray-600">Witaj, {currentUser.fullName || currentUser.username} ({currentUser.role})</p>
            </div>
            <div className="flex gap-2">
              {currentUser.role === 'admin' && (
                <button onClick={() => setShowAdminPanel(true)} className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                  Panel administratora
                </button>
              )}
              <button onClick={handleLogout} className="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 flex items-center gap-2">
                <LogOut size={16} /> Wyloguj
              </button>
            </div>
          </div>
        </div>

        {!selectedLine ? (
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {productionLines.map(line => (
              <button
                key={line.id}
                onClick={() => setSelectedLine(line)}
                className="bg-white p-6 rounded-lg shadow-md hover:shadow-xl transition transform hover:scale-105"
              >
                <h3 className="text-xl font-bold text-gray-800 mb-2">{line.name}</h3>
                <p className="text-gray-600">{line.instructions.length} instrukcji</p>
              </button>
            ))}
          </div>
        ) : (
          <div>
            <button onClick={() => setSelectedLine(null)} className="mb-4 px-4 py-2 bg-gray-200 rounded-lg hover:bg-gray-300">
              ← Powrót do linii
            </button>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
              {selectedLine.instructions.map(instruction => (
                <button
                  key={instruction.id}
                  onClick={() => { setSelectedInstruction(instruction); setCurrentStep(0); }}
                  className="bg-white p-6 rounded-lg shadow-md hover:shadow-xl transition transform hover:scale-105"
                >
                  <h3 className="text-lg font-bold text-gray-800 mb-2">{instruction.name}</h3>
                  <p className="text-gray-600">{instruction.steps.length} kroków</p>
                </button>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(ProductionVideoApp));
    </script>
</body>
</html>
